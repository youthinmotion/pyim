<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — Project Youth in Motion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#e9f0d5;
    --text:#111622;
    --muted:#4e5a70;
    --line:#e3dac9;
    --accent:#1a365d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter", sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

img{
    display:block;
    width:100%;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

header{
    border-bottom:1px solid var(--line);
    padding:24px 0;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-family:"Libre Baskerville",serif;
    font-size:1.1rem;
    text-decoration:none;
    color:var(--text);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:24px;
}

.nav-links a.plain-link{
    color:var(--muted);
    font-size:.95rem;
}

.nav-links a.plain-link:hover{
    color:var(--text);
}

.button{
    display:inline-block;
    text-decoration:none;
    color:var(--text);
    border:1px solid var(--text);
    padding:14px 26px;
    transition:.25s;
}

.button:hover{
    background:var(--text);
    color:var(--bg);
}

.plain-link{
    color:inherit;
    text-decoration:none;
}

.plain-link:hover{
    text-decoration:underline;
}

/* ---- page title bar ---- */

.page-title{
    border-bottom:1px solid var(--line);
    padding:56px 0;
}

.eyebrow{
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:.75rem;
    color:var(--muted);
    margin-bottom:16px;
}

.page-title h1{
    font-family:"Libre Baskerville",serif;
    font-size:clamp(2.2rem,4.4vw,3.2rem);
}

/* ---- about section ---- */

.section{
    padding:100px 0;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:90px;
    align-items:center;
}

.about-image{
    aspect-ratio:1/1;
    overflow:hidden;
}

.about-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.about-copy .eyebrow{
    margin-bottom:20px;
}

.about-copy h2{
    font-family:"Libre Baskerville",serif;
    font-size:clamp(2rem,3.6vw,2.8rem);
    margin-bottom:24px;
}

.about-copy p{
    color:var(--muted);
    max-width:520px;
    margin-bottom:20px;
}

.about-copy p:last-of-type{
    margin-bottom:32px;
}

footer{
    border-top:1px solid var(--line);
    padding:32px 0;
    color:var(--muted);
    text-align:center;
}

.footer-links{
    margin-top:10px;
    font-size:.9rem;
}

.footer-links a{
    color:var(--muted);
    text-decoration:none;
    margin:0 8px;
}

.footer-links a:hover{
    text-decoration:underline;
}

.fade{
    opacity:0;
    transform:translateY(30px);
    transition:.8s ease;
}

.fade.visible{
    opacity:1;
    transform:none;
}

@media(max-width:900px){

    .nav-links a.plain-link{
        display:none;
    }

    .about-grid{
        grid-template-columns:1fr;
        gap:36px;
    }

    .section{
        padding:70px 0;
    }

    .page-title{
        padding:44px 0;
    }
}
</style>
</head>
<body>

<header>
    <div class="container nav">
        <a href="index.html" class="brand">Project Youth in Motion</a>

    </div>
</header>

<section class="page-title">
    <div class="container">
        <h1 class="fade">About Us</h1>
    </div>
</section>

<section class="section">
    <div class="container about-grid">

        <div class="about-image fade">
            <img src="images/sarikaIMAGE.jpeg" alt="Name">
        </div>

        <div class="about-copy fade">
            <h3>Founder</h3>

            <h2>Sarika Tahirah</h2>
            <p>
               Bio paragraph one goes here.
            </p>
            <p>
            Bio paragraph two goes here if needed!

            </p>
            <a href="mailto:hello@torahmorah.com" class="button">Get in touch</a>
        </div>

        <div class="about-image fade">
            <img src="images/adam.jpeg" alt="Name">
        </div>

        <div class="about-copy fade">
            <h3>Website Designer</h3>

            <h2>Adam Bellows</h2>
            <p>
               Bio paragraph one goes here.
            </p>
            <p>
            Bio paragraph two goes here if needed!

            </p>
            <a href="mailto:hello@torahmorah.com" class="button">Get in touch</a>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        © 2026 Project Youth in Motion

    </div>
</footer>

<script>
const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.classList.add("visible");
        }
    });
}, { threshold: 0.15 });

document.querySelectorAll(".fade").forEach((el) => {
    observer.observe(el);
});
</script>

</body>
</html>
