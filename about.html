<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — Project Youth in Motion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#e9f0d5;
    --text:#111622;
    --muted:#4e5a70;
    --line:#e3dac9;
    --accent:#1a365d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter", sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

header{
    border-bottom:1px solid var(--line);
    padding:24px 0;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-family:"Libre Baskerville",serif;
    font-size:1.1rem;
    text-decoration:none;
    color:var(--text);
}

/* PAGE TITLE */

.page-title{
    padding:56px 0;
}

.page-title h1{
    font-family:"Libre Baskerville",serif;
    font-size:clamp(2.2rem,4.4vw,3.2rem);
    text-align:center;
}

/* PEOPLE GRID */

.people-section{
    padding:30px 0 110px;
}

.people-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:60px;
    max-width:850px;
    margin:0 auto;
}

.person-card{
    color:var(--text);
    display:block;
}

.person-image{
    aspect-ratio:1 / 1;
    overflow:hidden;
    margin-bottom:22px;
    background:#dce5c5;
}

.person-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .45s ease;
}

.person-card:hover .person-image img{
    transform:scale(1.04);
}

.person-role{
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:.72rem;
    color:var(--muted);
    margin-bottom:7px;
}

.person-name{
    font-family:"Libre Baskerville",serif;
    font-size:1.45rem;
}

/* FOOTER */

footer{
    border-top:1px solid var(--line);
    padding:32px 0;
    color:var(--muted);
    text-align:center;
}

/* FADE */

.fade{
    opacity:0;
    transform:translateY(25px);
    transition:.8s ease;
}

.fade.visible{
    opacity:1;
    transform:none;
}

/* MOBILE */

@media(max-width:700px){

    .page-title{
        padding:44px 0;
    }

    .people-section{
        padding:10px 0 80px;
    }

    .people-grid{
        grid-template-columns:1fr;
        gap:50px;
        max-width:500px;
    }

    .person-name{
        font-size:1.3rem;
    }
}
</style>
</head>

<body>

<header>
    <div class="container nav">
        <a href="index.html" class="brand">
            Project Youth in Motion
        </a>
    </div>
</header>

<section class="page-title">
    <div class="container">
        <h1 class="fade">About Us</h1>
    </div>
</section>

<section class="people-section">

    <div class="container">

        <div class="people-grid">

            <!-- SARIKA -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/IMG_4602.heic"
                        alt="Sarika Tahirah"
                    >
                </div>

                <div class="person-name">
                    Sarika Tahirah
                </div>

            </div>


            


            <!-- PERSON 3 -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/014.heic"
                        alt="Farzana Ahmed"
                    >
                </div>

                <div class="person-name">
                    Farzana Ahmed
                </div>

            </div>


            <!-- PERSON 4 -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/IMG_2152.jpeg"
                        alt="Momtaj Begum"
                    >
                </div>

                <div class="person-name">
                    Momtaj Begum
                </div>

            </div>


            <!-- PERSON 5 -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/baktiar.jpeg"
                        alt="Baktiar Miah"
                    >
                </div>

                <div class="person-name">
                    Baktiar Miah
                </div>

            </div>


            <!-- PERSON 6 -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/kamrun.heic"
                        alt="Kamrun Nahar"
                    >
                </div>

                <div class="person-name">
                    Kamrun Nahar
                </div>

            </div>
            <!-- ADAM -->

            <div class="person-card fade">

                <div class="person-image">
                    <img
                        src="images/adam.jpeg"
                        alt="Adam Bellows"
                    >
                </div>

                <div class="person-name">
                    Adam Bellows
                </div>

            </div>

        </div>

    </div>

</section>

<footer>
    <div class="container">
        © 2026 Project Youth in Motion
    </div>
</footer>


<script>

const observer = new IntersectionObserver((entries) => {

    entries.forEach((entry) => {

        if(entry.isIntersecting){
            entry.target.classList.add("visible");
        }

    });

}, {
    threshold:0.15
});

document.querySelectorAll(".fade").forEach((el) => {
    observer.observe(el);
});

</script>

</body>
</html>
