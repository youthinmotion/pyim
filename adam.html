<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adam Bellows — Project Youth in Motion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#e9f0d5;
    --text:#111622;
    --muted:#4e5a70;
    --line:#e3dac9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Inter",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

header{
    border-bottom:1px solid var(--line);
    padding:24px 0;
}

.brand{
    font-family:"Libre Baskerville",serif;
    text-decoration:none;
    color:var(--text);
    font-size:1.1rem;
}

.person-page{
    padding:80px 0 110px;
}

.back{
    display:inline-block;
    margin-bottom:55px;
    color:var(--muted);
    text-decoration:none;
    font-size:.9rem;
}

.back:hover{
    text-decoration:underline;
}

.person-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.person-photo{
    aspect-ratio:1 / 1;
    overflow:hidden;
}

.person-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.role{
    letter-spacing:.12em;
    font-size:.75rem;
    margin-bottom:15px;
}

h1{
    font-family:"Libre Baskerville",serif;
    font-size:clamp(2.2rem,4vw,3.4rem);
    margin-bottom:28px;
}

.bio{
    color:var(--muted);
    max-width:500px;
}

.bio p{
    margin-bottom:20px;
}

footer{
    border-top:1px solid var(--line);
    padding:32px 0;
    color:var(--muted);
    text-align:center;
}

@media(max-width:750px){

    .person-page{
        padding:55px 0 80px;
    }

    .back{
        margin-bottom:35px;
    }

    .person-layout{
        grid-template-columns:1fr;
        gap:40px;
    }

}

</style>
</head>

<body>

<header>
    <div class="container">
        <a href="index.html" class="brand">
            Project Youth in Motion
        </a>
    </div>
</header>

<main class="person-page">

    <div class="container">

        <a href="about.html" class="back">
            ← Back to About Us
        </a>

        <div class="person-layout">

            <div class="person-photo">
                <img
                    src="images/adam.jpeg"
                    alt="Adam Bellows"
                >
            </div>

            <div>

                <div class="role">
                    Website Designer
                </div>

                <h1>
                    Adam Bellows
                </h1>

                <div class="bio">

                    <p>
                        Bio paragraph one goes here.
                    </p>

                    <p>
                        Bio paragraph two goes here if needed!
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>

<footer>
    <div class="container">
        © 2026 Project Youth in Motion
    </div>
</footer>

</body>
</html>
